<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fernando d'Ávila is a Full Stack and AI Developer building web applications, NLP tools, OCR systems, and machine learning solutions.">
    <meta name="author" content="Fernando d'Ávila">
    <meta property="og:title" content="Fernando d'Ávila | Full Stack &amp; AI Developer">
    <meta property="og:description" content="Portfolio with AI, machine learning, full-stack development, research, and applied software projects.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="assets/fernando-hero.jpg">
    <meta name="theme-color" content="#5f87b3">
    <title>Fernando d'Ávila | Full Stack &amp; AI Developer</title>

    <link rel="icon" href="assets/favicon.ico?v=1" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=1">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png?v=1">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=1">

    <script>
        (() => {
            const savedTheme = localStorage.getItem('portfolio-theme');
            const theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
            document.documentElement.lang = localStorage.getItem('portfolio-language') === 'pt-BR' ? 'pt-BR' : 'en-US';
        })();
    </script>
    <link rel="stylesheet" href="assets/css/style.css?v=20260911-8">
</head>
<body>
    <div class="background" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div id="nav-placeholder"></div>

    <main>
        <div id="home-placeholder"></div>
        <div id="experience-placeholder"></div>
        <div id="build-flow-placeholder"></div>
        <div id="projects-placeholder"></div>
        <div id="skills-placeholder"></div>
        <div id="profiles-placeholder"></div>
        <div id="contact-placeholder"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="assets/js/i18n.js?v=20260911-3"></script>
    <script>
        async function loadPartial(path, selector) {
            try {
                const res = await fetch(path, { cache: 'no-store' });
                if (!res.ok) throw new Error(path + ' not found');
                const html = await res.text();
                document.querySelector(selector).innerHTML = html;
            } catch (e) {
                console.error(e);
            }
        }

        const partials = [
            { path: 'partials/nav.html', selector: '#nav-placeholder' },
            { path: 'partials/home.html', selector: '#home-placeholder' },
            { path: 'partials/experience.html', selector: '#experience-placeholder' },
            { path: 'partials/build-flow.html', selector: '#build-flow-placeholder' },
            { path: 'partials/projects.html', selector: '#projects-placeholder' },
            { path: 'partials/skills.html', selector: '#skills-placeholder' },
            { path: 'partials/profiles.html', selector: '#profiles-placeholder' },
            { path: 'partials/contact.html', selector: '#contact-placeholder' },
            { path: 'partials/footer.html', selector: '#footer-placeholder' }
        ];

        (async () => {
            await Promise.all(partials.map(p => loadPartial(p.path, p.selector)));
            initPageScripts();
        })();

        function initPageScripts() {
            const yearEl = document.getElementById('current-year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();

            initLanguageSelector();
            initThemeSelector();
            initBentoCards();
            initFooterMatrix();

            const sections = document.querySelectorAll('section');
            const navLinks = document.querySelectorAll('nav a');

            window.addEventListener('scroll', () => {
                let current = '';
                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    if (window.scrollY >= sectionTop - 200) {
                        current = section.getAttribute('id');
                    }
                });

                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === `#${current}`) {
                        link.classList.add('active');
                    }
                });
            });

            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (!target) return;
                    const offsetTop = target.offsetTop - 80;
                    window.scrollTo({ top: offsetTop, behavior: 'smooth' });
                });
            });

            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, observerOptions);

            document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        }

        function initThemeSelector() {
            const buttons = document.querySelectorAll('[data-theme-value]');
            const themeColor = document.querySelector('meta[name="theme-color"]');

            const applyTheme = (theme) => {
                document.documentElement.dataset.theme = theme;
                localStorage.setItem('portfolio-theme', theme);
                if (themeColor) themeColor.content = theme === 'dark' ? '#171416' : '#5f87b3';
                buttons.forEach((button) => {
                    const selected = button.dataset.themeValue === theme;
                    button.setAttribute('aria-pressed', String(selected));
                });
            };

            buttons.forEach((button) => {
                button.addEventListener('click', () => applyTheme(button.dataset.themeValue));
            });

            applyTheme(document.documentElement.dataset.theme || 'light');
        }

        function initBentoCards() {
            document.querySelectorAll('.bento-card').forEach((card) => {
                card.addEventListener('pointermove', (event) => {
                    const bounds = card.getBoundingClientRect();
                    card.style.setProperty('--pointer-x', `${event.clientX - bounds.left}px`);
                    card.style.setProperty('--pointer-y', `${event.clientY - bounds.top}px`);
                });
            });
        }

        function initFooterMatrix() {
            const matrix = document.querySelector('[data-matrix]');
            if (!matrix) return;

            const rows = 7;
            const cols = 34;
            const cells = [];
            const fragment = document.createDocumentFragment();

            for (let row = 0; row < rows; row += 1) {
                for (let col = 0; col < cols; col += 1) {
                    const cell = document.createElement('span');
                    cell.className = 'matrix-pixel';
                    cell.setAttribute('aria-hidden', 'true');
                    fragment.appendChild(cell);
                    cells.push({ cell, row, col });
                }
            }

            matrix.appendChild(fragment);

            if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
                cells.forEach(({ cell, row }) => {
                    cell.style.opacity = row === 3 ? '0.85' : '0.16';
                });
                return;
            }

            let frame = 0;
            let animationId;
            let lastTime = 0;
            let isVisible = false;

            const draw = (time) => {
                if (!isVisible) return;

                if (time - lastTime > 70) {
                    cells.forEach(({ cell, row, col }) => {
                        const waveRow = 3 + Math.sin(frame * 0.18 + col * 0.42) * 1.8;
                        const distance = Math.abs(row - waveRow);
                        const intensity = Math.max(0.1, 1 - distance * 0.42);
                        cell.style.opacity = intensity.toFixed(2);
                        cell.style.transform = `scale(${(0.72 + intensity * 0.32).toFixed(2)})`;
                    });
                    frame += 1;
                    lastTime = time;
                }

                animationId = requestAnimationFrame(draw);
            };

            const observer = new IntersectionObserver(([entry]) => {
                isVisible = entry.isIntersecting;
                cancelAnimationFrame(animationId);
                if (isVisible) animationId = requestAnimationFrame(draw);
            });

            observer.observe(matrix);
        }
    </script>
</body>
</html>
